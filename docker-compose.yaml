services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: ${PGADMIN_CONTAINER_NAME}
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "127.0.0.1:5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app_network

  migrations:
    build: .
    restart: "no"

    env_file:
      - .env

    environment:
      POSTGRES_HOSTNAME: postgres

    command: [ "alembic", "upgrade", "head" ]

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - app_network

  bot:
    build: .
    working_dir: /app
    container_name: ${BOT_CONTAINER_NAME}
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - PYTHONUNBUFFERED=1

    # Если в контейнере не резолвятся домены (yt-dlp: [Errno -5] No address associated
    # with hostname) при том что с хоста резолвятся — раскомментируй и подставь свои DNS:
    # dns:
    #   - 8.8.8.8
    #   - 1.1.1.1

    volumes:
      - ./logs:/app/logs

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - app_network

volumes:
  postgres_data:
  pgadmin_data:
  portainer_data:

networks:
  app_network:
    driver: bridge