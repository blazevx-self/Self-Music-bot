  help:
    command: |
      <tg-emoji emoji-id="6028435952299413210">ℹ️</tg-emoji> <b>Что умеет этот бот?</b>

      <b>Поиск музыки:</b>
      Отправь имя артиста или название трека — найду совпадения и превью.

      <b>Распознавание:</b>
      Голосовое, кружок, аудио или видео с песней — скажу название и исполнителя.
      Если не срабатывает — включи распознавание в настройках.

      /playlists — свои плейлисты
      /settings — настройки
      /help — эта справка
    menu: |
      <tg-emoji emoji-id="5260652149469094137">🎙</tg-emoji> <b>Возможности:</b>

      <b>Как искать песни?</b>
      • Напиши название трека или имя исполнителя — покажу совпадения и короткое превью.

      <b>Как открыть альбом?</b>
      • Пришли ссылку на альбом или плейлист Deezer / Apple Music.

      <b>Как распознать песню?</b>
      • Видео, голосовое, кружок или аудио — название и исполнитель.
      • Сначала включи функцию в настройках.

      <b>Как сохранить трек у себя?</b>
      • Открой превью в чате и сохрани файл в Telegram.

      <b>Как собрать свой плейлист?</b>
      • Команда /playlists — создай список и добавляй найденные треки.
    buttons:
      back: Назад

